[package]
name = "backtrack-cli"
description = "Backtrack CLI: thin client over the daemon's D-Bus interface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "backtrack"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
backtrack-core.workspace = true
clap.workspace = true
tracing.workspace = true
tokio.workspace = true
zbus.workspace = true
serde_json.workspace = true
# `doctor` writes a compressed bundle; both are pure Rust, so no shelling out
# to tar on a machine that may already be misbehaving.
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
