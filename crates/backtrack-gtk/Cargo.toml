[package]
name = "backtrack-gtk"
description = "Backtrack's desktop programs: the GTK4/libadwaita app (timeline, wizard, preferences, compare) and the tray icon."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
backtrack-core.workspace = true
gtk4.workspace = true
libadwaita.workspace = true
# The same GLib `gtk4` re-exports, named directly by the modules the tray
# shares with the window, so that the tray links GLib and no GTK.
glib = "0.22"
# The tray's StatusNotifierItem. Only `backtrack-tray` uses it.
ksni = "0.3"
tracing.workspace = true
clap.workspace = true
zbus.workspace = true
# Not for concurrency here — the window is single-threaded. `oo7` turns on
# zbus's tokio backend for the whole workspace, so zbus expects a Tokio
# runtime to exist wherever it is called from. See `main`.
tokio.workspace = true
# For `StreamExt` over the daemon's signal streams.
futures.workspace = true
# The index worker hands results back to the main loop over this; glib's own
# channel was removed from the Rust bindings in favour of it.
async-channel = "2"
# The line diff behind the compare view.
similar.workspace = true
# Preferences hands settings to the daemon as TOML literals, which core
# renders from anything serialisable.
serde.workspace = true
# The wizard's passphrase strength meter. A port of Dropbox's estimator rather
# than a length-and-character-classes count, which rates "Password1!" strong.
# The derive-builder feature is only for constructing its options, which the
# meter never does.
zxcvbn = { version = "3.1", default-features = false }

[dev-dependencies]
tempfile = "3"
