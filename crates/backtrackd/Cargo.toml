[package]
name = "backtrackd"
description = "Backtrack daemon: scheduler, D-Bus service, job queue."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
backtrack-core.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
zbus.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio-util.workspace = true
rustix.workspace = true
async-trait.workspace = true
# The Background portal, which is how a Flatpak build runs in the background
# and starts at login; outside a sandbox the systemd unit does both.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "background"] }

[features]
# Enables tests that shell out to a real `borg` (run via `just test-integration`).
integration = []

[dev-dependencies]
tempfile = "3"
# p2p only for tests: the end-to-end test drives the real interface over a
# socket pair, so it needs no bus daemon. Production builds do not carry it.
zbus = { workspace = true, features = ["p2p"] }
backtrack-testkit = { path = "../backtrack-testkit" }
# A paused clock, so tests of timing behaviour take no time and never race it.
tokio = { workspace = true, features = ["test-util"] }
