[package]
name = "backtrack-core"
description = "Backtrack core library: borg adapter, index, spool, restore engine, config."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Enables tests that shell out to a real `borg` (run via `just test-integration`).
integration = []
# The status line (`status_line`), whose dates go through GLib: the tray and
# the daemon turn it on, the command line does not.
glib = ["dep:glib"]

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_ignored.workspace = true
zvariant.workspace = true
tokio.workspace = true
rustix.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio-util.workspace = true
oo7.workspace = true
glib = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
