[workspace]
resolver = "2"
members = [
    "crates/backtrack-core",
    "crates/backtrackd",
    "crates/backtrack-gtk",
    "crates/backtrack-cli",
    "crates/backtrack-testkit",
    "xtask",
]

# Version is the single Rust source of truth. It is changed ONLY by a human via
# `just bump-version` (see VERSIONING.md). Crates inherit it with
# `version.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Keith Vassallo <keith@vassallo.cloud>"]
repository = "https://github.com/keithvassallomt/backtrack"

# Pinned once here; crates opt in with `<dep>.workspace = true`.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "signal", "io-util", "time"] }
rustix = { version = "1", features = ["fs", "process"] }
zbus = "5"
# Just the D-Bus type system: core defines the wire payloads both the daemon
# and its clients marshal, without depending on a D-Bus implementation.
zvariant = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Reports the keys serde skipped, so an unknown config key can warn instead of
# failing the load (a stale key must never stop the daemon starting).
serde_ignored = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
# Minimum supported platform: GTK 4.22 + libadwaita 1.9 — GNOME 50, which is
# what Ubuntu 26.04 LTS ships.
#
# The version features gate the bindings to that API level, so building is the
# test of the claim: an API from a later release will not compile, and a
# *deprecated* one warns — which under CI's `-D warnings` is an error. That is
# the point of pinning high rather than low. Targeting an old GNOME does not
# only cost features; it hides the deprecations, and a program written against
# APIs that are already on their way out is one that has to be rewritten to
# stand still.
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
oo7 = "0.6"
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"

# Internal crate, referenced by the binaries.
backtrack-core = { path = "crates/backtrack-core" }

# Shared lint policy. Crates opt in with `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, so these turn on the extra rigor we want.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

