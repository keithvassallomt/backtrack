[workspace]
resolver = "2"
members = [
    "crates/backtrack-core",
    "crates/backtrackd",
    "crates/backtrack-gtk",
    "crates/backtrack-cli",
    "crates/backtrack-testkit",
    "xtask",
]

# Version is the single Rust source of truth. It is changed ONLY by a human via
# `just bump-version` (see VERSIONING.md). Crates inherit it with
# `version.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Keith Vassallo <keith@vassallo.cloud>"]
repository = "https://github.com/keithvassallomt/backtrack"

# Pinned once here; crates opt in with `<dep>.workspace = true`.
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "signal", "io-util", "time"] }
rustix = { version = "1", features = ["fs", "process"] }
zbus = "5"
# Just the D-Bus type system: core defines the wire payloads both the daemon
# and its clients marshal, without depending on a D-Bus implementation.
zvariant = "5"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Reports the keys serde skipped, so an unknown config key can warn instead of
# failing the load (a stale key must never stop the daemon starting).
serde_ignored = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
# Minimum supported platform: GTK 4.16 + libadwaita 1.6 (GNOME 47). The version
# features gate the bindings to that API level, so building is the test of the
# claim — an API from a later release will not compile.
#
# Raised from GNOME 46 during Stage 7. What it costs is Ubuntu 24.04 LTS, whose
# GNOME 46 stops at libadwaita 1.5. What it buys is that dialogs can ask for
# their responses in a row rather than a column, which is not decoration:
# stacked responses lose the left-to-right ordering that puts the safe way out
# under the hand and the destructive one furthest from it. Working around its
# absence meant setting a property by name and hoping, which is not a thing to
# ship for the sake of a distribution two years behind.
gtk4 = { version = "0.11", features = ["v4_16"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
oo7 = "0.6"
async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"

# Internal crate, referenced by the binaries.
backtrack-core = { path = "crates/backtrack-core" }

# Shared lint policy. Crates opt in with `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, so these turn on the extra rigor we want.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

