name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BACKTRACK_DEV: "1"

jobs:
  ci:
    name: check (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain and system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            just cargo clippy rustfmt gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel sqlite-devel dbus-devel \
            borgbackup python3 git openssl-devel ruff desktop-file-utils

      - name: Quality gate (fmt, clippy -D warnings, tests, license headers, extensions)
        run: just check

      - name: Guard against printing where tracing is wanted
        run: just check-prints

      - name: Verify version consistency
        run: just verify-version

      - name: Integration tests (real borg)
        run: just test-integration

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  flatpak:
    name: Flatpak (offline build)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # flatpak-builder downloads every source first, then builds each module
      # in a sandbox with no network (none of ours asks for one), so a source
      # missing from cargo-sources.json or python3-requirements.json fails the
      # build here rather than being fetched quietly.
      - name: Build the Flatpak from its offline sources
        # v6.8
        uses: flatpak/flatpak-github-actions/flatpak-builder@aa777012a985fe1b1fd3e66ea2173609cf0c9a70
        with:
          manifest-path: packaging/flatpak/tools.backtrack.Backtrack.yml
          bundle: backtrack.flatpak
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.json') }}
